<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>View Album - American Legion Riders 394</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/navigation.css" />
    <!-- Reuses your gallery stylesheet module rules directly -->
    <link rel="stylesheet" href="css/page-gallery.css" />
</head>
<body>

    <div id="header-placeholder"></div>

    <main>
        <!-- 🌟 Dynamic Hero Header: Subtext details will be updated by the inner script below -->
        <section class="page-hero">
            <div class="wrap">
                <p class="eyebrow" id="album-eyebrow">Gallery Album</p>
                <h1 id="album-title">Loading Album...</h1>
                <p id="album-description">Fetching media content tracks securely from repository cache listings...</p>
            </div>
        </section>

        <!-- 🌟 Content Frame Unit Grid Wrapper -->
        <section class="section wrap">
            <!-- Back navigation hyperlink matching your master CSS rules -->
            <a href="gallery.html" class="gallery-back">&larr; Back To Galleries</a>

            <!-- The grid layer container box where inner images will be dropped side-by-side -->
            <div class="gallery-photo-grid" id="album-photos-grid"></div>
        </section>
    </main>

    <footer id="footer-placeholder"></footer>

    <!-- Lightbox Pop-up System Overlay markup frame layer wrapper -->
    <div id="lightbox-overlay">
        <span>&times;</span>
        <img id="lightbox-target-image" src="" alt="Full view preview">
    </div>

    <script src="injector.js"></script>
    <script src="album.js"></script> <!-- 🛠️ Runs the dynamic sub-page image reader engine -->
</body>
</html>
