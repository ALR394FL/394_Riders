name: Master Google Drive & Repository Synchronization

on:
  # schedule:
  #   - cron: '23 */6 * * *' # every 6 hours at minute 23 (e.g., 12:23, 6:23, etc.).
  workflow_dispatch: # Allows manual one-click execution from the GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-and-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google API Client
        run: |
          python -m pip install --upgrade pip
          pip install google-auth google-api-python-client

      # ==========================================
      # STEP 1: DOWNLOAD NEW ASSETS FROM GDRIVE
      # ==========================================
      - name: Run Sync Script
        env:
          DRIVE_CREDENTIALS: ${{ secrets.ALR_DRIVE_CEDENTIALS }}
          FOLDER_ID: ${{ secrets.ALR_FOLDER_ID }}
          CALENDAR_CREDENTIALS: ${{ secrets.ALR_DRIVE_CEDENTIALS }}
          CALENDAR_ID: ${{ secrets.ALR_CALENDAR_ID }}
        run: python .github/scripts/sync_drive.py

      # ==========================================
      # STEP 2: DYNAMICALLY REGENERATE ALBUMS INDEX
      # ==========================================
      - name: Scan Categorized Folders and Build Photos JSON
        run: |
          shopt -s nullglob
          
          # Dynamically discover all directories inside images/
          categories=()
          if [ -d "images" ]; then
            for d in images/*/; do
              categories+=("$(basename "$d")")
            fi
          fi
          
          # Fallback if images directory is completely empty
          if [ ${#categories[@]} -eq 0 ]; then
            categories+=("uncategorized")
          fi

          cat_count=${#categories[@]}

          echo "{" > photos.json
          echo "  \"categoryOrder\": [" >> photos.json
          for ((i=0; i<cat_count; i++)); do
            if [ $i -lt $((cat_count - 1)) ]; then
              echo "    \"${categories[$i]}\"," >> photos.json
            else
              echo "    \"${categories[$i]}\"" >> photos.json
            fi
          done
          echo "  ]," >> photos.json
          echo "  \"albums\": {" >> photos.json

          for ((i=0; i<cat_count; i++)); do
            cat_slug="${categories[$i]}"
            
            # Format display title cleanly from folder slug name
            cat_title=$(echo "$cat_slug" | sed 's/[-_]/ /g' | awk '{for(i=1;i<=NF;i++)sub(/./,toupper(substr($i,1,1)),$i)}1')

            echo "    \"$cat_slug\": [" >> photos.json
            first_file=true
            
            for file in images/$cat_slug/*.{jpg,jpeg,png,webp,JPG,JPEG,PNG,WEBP}; do
              filename=$(basename "$file")
              clean_caption=$(echo "${filename%.*}" | sed 's/[-_]/ /g' | awk '{for(i=1;i<=NF;i++)sub(/./,toupper(substr($i,1,1)),$i)}1')
              
              if [ "$first_file" = true ]; then
                first_file=false
              else
                echo "," >> photos.json
              fi
              echo "      {" >> photos.json
              echo "        \"path\": \"images/$cat_slug/$filename\"," >> photos.json
              echo "        \"title\": \"$cat_title\"," >> photos.json
              echo "        \"caption\": \"$clean_caption\"" >> photos.json
              echo -n "      }" >> photos.json
            done
            echo "" >> photos.json
            
            if [ $i -lt $((cat_count - 1)) ]; then
              echo "    ]," >> photos.json
            else
              echo "    ]" >> photos.json
            fi
          done
          echo "  }" >> photos.json
          echo "}" >> photos.json

      # ==========================================
      # STEP 3: DYNAMICALLY REGENERATE ARCHIVES INDEX
      # ==========================================
      - name: Scan Folders and Build Documents JSON
        run: |
          shopt -s nullglob
          
          # Dynamically discover all directories inside documents/
          folders=()
          if [ -d "documents" ]; then
            for d in documents/*/; do
              folders+=("$(basename "$d")")
            fi
          fi

          # Fallback if documents directory is completely empty
          if [ ${#folders[@]} -eq 0 ]; then
            folders+=("uncategorized")
          fi

          fold_count=${#folders[@]}

          echo "{" > documents.json
          echo "  \"documentOrder\": [" >> documents.json
          for ((i=0; i<fold_count; i++)); do
            if [ $i -lt $((fold_count - 1)) ]; then
              echo "    \"${folders[$i]}\"," >> documents.json
            else
              echo "    \"${folders[$i]}\"" >> documents.json
            fi
          done
          echo "  ]," >> documents.json
          echo "  \"archives\": {" >> documents.json

          for ((i=0; i<fold_count; i++)); do
            fold_slug="${folders[$i]}"
            
            # Format display label cleanly from folder slug name
            label=$(echo "$fold_slug" | sed 's/[-_]/ /g' | awk '{for(i=1;i<=NF;i++)sub(/./,toupper(substr($i,1,1)),$i)}1')

            echo "    \"$fold_slug\": [" >> documents.json
            first_file=true
            
            for file in documents/$fold_slug/*.{pdf,docx,xlsx,txt,PDF,DOCX,XLSX,TXT}; do
              filename=$(basename "$file")
              ext="${filename##*.}"
              ext_upper=$(echo "$ext" | tr '[:lower:]' '[:upper:]' )
              clean_title=$(echo "${filename%.*}" | sed 's/[-_]/ /g' | awk '{for(i=1;i<=NF;i++)sub(/./,toupper(substr($i,1,1)),$i)}1')
              
              if [ "$first_file" = true ]; then
                first_file=false
              else
                echo "," >> documents.json
              fi
              echo "      {" >> documents.json
              echo "        \"path\": \"documents/$fold_slug/$filename\"," >> documents.json
              echo "        \"title\": \"$clean_title\"," >> documents.json
              echo "        \"type\": \"$ext_upper\"," >> documents.json
              echo "        \"label\": \"$label\"" >> documents.json
              echo -n "      }" >> documents.json
            done
            echo "" >> documents.json
            
            if [ $i -lt $((fold_count - 1)) ]; then
              echo "    ]," >> documents.json
            else
              echo "    ]" >> documents.json
            fi
          done
          echo "  }" >> documents.json
          echo "}" >> documents.json

      # ==========================================
      # STEP 4: SINGLE UNIFIED GIT COMMIT AND PUSH
      # ==========================================
      - name: Commit and Push Changes back to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage asset directories, deletions, and structural metadata files
          git add documents/ images/ photos.json documents.json events.json
          
          # Safely verify workspace changes to bypass failure routines if no updates occurred
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: master update of media assets, document files, and catalogs [skip ci]" && git push)
